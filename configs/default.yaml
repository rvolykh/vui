app:
  default_vault: "default"
  theme: "dark"
  refresh_interval: 30
  max_secret_size: 10240
  clipboard_timeout: 5

ui:
  show_hidden_secrets: false
  confirm_deletions: true
  auto_refresh: true
  tree_width: 40

vaults:
  default:
    address: "http://localhost:8200"
    auth_method: "token"
    token: "${VAULT_TOKEN_DEFAULT}"
    namespace: ""

  vault-token:
    address: "http://localhost:8201"
    auth_method: "token"
    token: "vui-sandbox-token"
    namespace: ""

  vault-ldap:
    address: "http://localhost:8202"
    auth_method: "ldap"
    namespace: ""
    auth_config:
      username: "testuser"
      password: "testpassword"


  production:
    address: "https://vault-prod.company.com"
    auth_method: "token"
    token: "${VAULT_TOKEN_PROD}"
    namespace: "production"

  development:
    address: "http://localhost:8200"
    auth_method: "token"
    token: "dev-token"
    namespace: "dev"
