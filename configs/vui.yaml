app:
  theme: "dark"
  refresh_interval: 30
  max_secret_size: 10240
  clipboard_timeout: 5

ui:
  show_hidden_secrets: false
  confirm_deletions: true
  auto_refresh: true
  tree_width: 40

vaults:
  vault-token:
    address: "http://localhost:8200"
    auth_method: "token"
    namespace: ""
    auth_config:
      token: "${VAULT_TOKEN}"

  vault-ldap:
    address: "http://localhost:8200"
    auth_method: "ldap"
    namespace: ""
    auth_config:
      username: "${LDAP_USERNAME}"
      password: "${LDAP_PASSWORD}"

  vault-aws:
    address: "http://localhost:8200"
    auth_method: "aws"
    namespace: ""
    auth_config:
      aws_role: "vui-iam-role"
      aws_access_key_id: "${AWS_ACCESS_KEY_ID}"
      aws_secret_access_key: "${AWS_SECRET_ACCESS_KEY}"
      aws_session_token: "${AWS_SESSION_TOKEN}"

  vault-k8s:
    address: "http://localhost:8200"
    auth_method: "kubernetes"
    namespace: ""
    auth_config:
      k8s_role: "vui-k8s-role"
      k8s_service_account: "vui-sandbox-app-sa"
      k8s_audience: "vault"
      k8s_ttl: 3600

  vault-azure-todo:
    address: "http://localhost:8201"
    auth_method: "azure"
    namespace: ""
    auth_config:
      azure_role: "vui-azure-role"
      azure_resource: "TODO"
