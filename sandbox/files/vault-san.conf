# openssl genrsa -out vault.key 2048
# openssl req -x509 -new -nodes -key vault.key -sha256 -days 10950 -out vault.crt -config vault-san.conf -extensions 'req_ext'
# chmod 444 vault.crt vault.key

[ req ]
default_bits = 2048
prompt = no
encrypt_key = no
default_md = sha256
distinguished_name = req_distinguished_name
req_extensions = req_ext

[ req_distinguished_name ]
commonName = "vault"

[ req_ext ]
subjectAltName = @alt_names

[ alt_names ]
DNS.1 = vault
DNS.2 = localhost
IP.1 = 127.0.0.1
